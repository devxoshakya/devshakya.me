[project]
name = "api"
version = "0.1.0"
description = "FastAPI API"
readme = "README.md"
authors = [{ name = "Dev Shakya", email = "devxoshakya@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["fastapi>=0.141.1", "uvicorn[standard]>=0.36.0"]

[project.scripts]
api = "main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false