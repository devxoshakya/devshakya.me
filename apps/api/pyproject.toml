[project]
name = "api"
version = "0.1.0"
description = "FastAPI API"
readme = "README.md"
authors = [{ name = "Dev Shakya", email = "devxoshakya@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlalchemy-orm>=1.2.10",
    "uvicorn[standard]>=0.36.0",
    "redis>=8.1.0",
    "asyncpg>=0.32.0",
]

[project.scripts]
api = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
